<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fashion Zone</title>

  <style>
    :root {
      --background: #0b0d12;
      --card: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.12);
      --text: #ffffff;
      --muted: #9da3ae;
      --button: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(80, 100, 255, 0.18), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(150, 60, 255, 0.14), transparent 30%),
        var(--background);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 32px 22px 24px;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid var(--border);
      border-radius: 30px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      animation: fadeIn 0.7s ease;
    }

    .profile {
      text-align: center;
      margin-bottom: 30px;
    }

    .profile-image {
      width: 86px;
      height: 86px;
      margin: 0 auto 17px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 700;
      color: white;

      background: linear-gradient(135deg, #252b38, #11151d);

      border: 2px solid rgba(255, 255, 255, 0.18);

      box-shadow:
        0 0 0 6px rgba(255, 255, 255, 0.025),
        0 10px 35px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 7px;
    }

    .number {
      color: var(--muted);
      font-size: 15px;
      letter-spacing: 0.3px;
      margin-bottom: 7px;
    }

    .tagline {
      color: #7f8794;
      font-size: 13px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .button {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      width: 100%;
      padding: 15px 18px;

      border-radius: 17px;
      border: 1px solid rgba(255, 255, 255, 0.09);

      background: var(--button);
      color: white;
      text-decoration: none;

      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.1px;

      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .button:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.11);
      border-color: rgba(255, 255, 255, 0.18);

      box-shadow:
        0 14px 28px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.07);
    }

    .button:active {
      transform: scale(0.97);
    }

    .icon {
      position: absolute;
      left: 18px;
      width: 28px;
      height: 28px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 9px;
      background: rgba(255, 255, 255, 0.08);

      font-size: 15px;
    }

    .call .icon {
      color: #ffffff;
    }

    .whatsapp .icon {
      color: #25D366;
    }

    .review .icon {
      color: #4285F4;
    }

    .maps .icon {
      color: #34A853;
    }

    .group .icon {
      color: #25D366;
    }

    .review {
      background: linear-gradient(
        135deg,
        rgba(66, 133, 244, 0.16),
        rgba(255, 255, 255, 0.06)
      );

      border-color: rgba(66, 133, 244, 0.28);
    }

    .review:hover {
      background: linear-gradient(
        135deg,
        rgba(66, 133, 244, 0.23),
        rgba(255, 255, 255, 0.08)
      );
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #656c78;
      font-size: 11px;
      letter-spacing: 0.5px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }

      .container {
        padding: 28px 17px 21px;
        border-radius: 27px;
      }

      h1 {
        font-size: 25px;
      }

      .button {
        min-height: 56px;
      }
    }
  </style>
</head>

</body>
</html>
